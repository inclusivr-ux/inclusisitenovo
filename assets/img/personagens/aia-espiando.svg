<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 210" width="220" height="210">
  <!-- Maga Aia espiando por cima de uma borda. Redesenho no traço do Aram para as animações do site.
       Versão para aprovação da equipe. As mãos ficam escondidas: nenhum gesto pode ser lido como sinal. -->
  <style>
    .t{stroke:#1a1a1a;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
    .f{stroke:#1a1a1a;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
    .olhos{transform-origin:110px 112px;animation:piscar 3.8s 1}
    .faisca{animation:subir 2.6s ease-out 1 both;opacity:0;transform-box:fill-box}
    .faisca:nth-of-type(2){animation-delay:.5s}.faisca:nth-of-type(3){animation-delay:1s}.faisca:nth-of-type(4){animation-delay:1.5s}.faisca:nth-of-type(5){animation-delay:2s}
    .aura{animation:pulsar 1.8s ease-in-out 2 alternate}
    @keyframes piscar{0%,60%,64%,100%{transform:scaleY(1)}62%{transform:scaleY(.08)}}
    @keyframes pulsar{from{opacity:.35}to{opacity:.8}}
    @keyframes subir{0%{opacity:0;transform:translateY(0) rotate(0)}20%{opacity:.95}100%{opacity:0;transform:translateY(-54px) rotate(45deg)}}
    @media (prefers-reduced-motion:reduce){.olhos,.faisca,.aura{animation:none}.faisca{opacity:.7}}
  </style>
  <!-- aura turquesa da magia -->
  <ellipse class="aura" cx="110" cy="150" rx="96" ry="60" fill="#58c4c8" opacity=".5" style="filter:blur(14px)"/>
  <!-- sombra deslocada lavanda -->
  <g fill="#ae7bff" transform="translate(-8 2)">
    <path d="M58 120c-8-44 18-78 52-78s60 34 52 78l10 60H48z"/>
    <path d="M18 190c10-26 40-36 92-36s82 10 92 36v24H18z"/>
  </g>
  <!-- capuz caído, atrás da cabeça -->
  <path class="t" d="M44 176c-4-40 22-74 66-76 44 2 70 36 66 76z" fill="#cfa96d"/>
  <path d="M150 112c14 14 22 34 22 60h-18c0-24-2-44-4-60z" fill="#b48b4f"/>
  <!-- cabelo acobreado, camada de trás, ondulado -->
  <path class="t" d="M68 104c-6-38 14-62 44-62 32 0 52 26 46 62l2 30c4 8 0 16-6 18 2-6 0-10-4-12-2 8-8 12-14 12 2-4 2-8 0-12l-48 0c-2 4-2 8 0 12-6 0-12-4-14-12-4 2-6 6-4 12-6-2-10-10-6-18z" fill="#8a3a12"/>
  <!-- capa cor de areia -->
  <path class="t" d="M20 214c4-30 32-46 90-46s86 16 90 46z" fill="#dab781"/>
  <path d="M152 176c18 6 32 18 38 36h-26c-2-14-6-26-12-36z" fill="#c09a5e"/>
  <path class="f" d="M70 172c10 8 24 12 40 12s30-4 40-12" fill="none"/>
  <path d="M58 196c6 4 10 10 12 16M162 196c-6 4-10 10-12 16" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="122" cy="186" r="5" fill="#8a5a2b" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- pescoço -->
  <path class="f" d="M97 146h26v22c-8 6-18 6-26 0z" fill="#f5c9a0"/>
  <!-- orelhas pontudas (élficas), as duas -->
  <path class="f" d="M145 102c8-6 21-13 32-15-4 11-13 24-23 30-4 2-8 0-9-4z" fill="#fedbb6"/>
  <path d="M151 105c6-4 13-8 18-9" fill="none" stroke="#f0a99a" stroke-width="3" stroke-linecap="round"/>
  <path class="f" d="M75 102c-8-6-21-13-32-15 4 11 13 24 23 30 4 2 8 0 9-4z" fill="#fedbb6"/>
  <path d="M69 105c-6-4-13-8-18-9" fill="none" stroke="#f0a99a" stroke-width="3" stroke-linecap="round"/>
  <!-- rosto -->
  <path class="t" d="M74 106c0-28 16-46 36-46s36 18 36 46c0 26-16 44-36 44s-36-18-36-44z" fill="#fedbb6"/>
  <ellipse cx="88" cy="127" rx="8" ry="5" fill="#f6b0a8"/>
  <ellipse cx="132" cy="127" rx="8" ry="5" fill="#f6b0a8"/>
  <!-- olhos -->
  <g class="olhos">
    <path d="M83 112c4-8 16-8 20 0-4 6-16 6-20 0z" fill="#fff"/>
    <path d="M117 112c4-8 16-8 20 0-4 6-16 6-20 0z" fill="#fff"/>
    <circle cx="96" cy="111" r="6" fill="#3a2418"/>
    <circle cx="130" cy="111" r="6" fill="#3a2418"/>
    <circle cx="98" cy="108.5" r="2" fill="#fff"/>
    <circle cx="132" cy="108.5" r="2" fill="#fff"/>
    <path d="M82 110c5-9 17-10 22-1M116 109c5-9 17-8 22 1" fill="none" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <path d="M84 96q8-5 17-2M120 94q9-3 17 2" fill="none" stroke="#6b2a0c" stroke-width="3" stroke-linecap="round"/>
  <path d="M110 118q-2 8 3 9" fill="none" stroke="#c98a6a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M102 135q8 6 16 0" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <!-- franja acobreada com mechas -->
  <path class="t" d="M70 104c-2-30 18-50 44-48 22 2 38 18 36 42-10-12-22-22-38-24 2 8-2 16-10 20 2-8 0-14-4-18-10 6-18 16-28 28z" fill="#9c4416"/>
  <path d="M112 60c14 2 26 10 32 22-8-6-18-10-28-12z" fill="#c4612a"/>
  <path d="M76 66c4-4 8-6 12-7-4 4-6 8-7 12z" fill="#c4612a"/>
  <path d="M74 100c-3 16 0 30 6 42M146 98c4 14 3 28-2 40" fill="none" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- faíscas quadradas (magia + tecnologia) -->
  <g fill="#58e6e6">
    <rect class="faisca" x="178" y="176" width="8" height="8"/>
    <rect class="faisca" x="34" y="170" width="6" height="6"/>
    <rect class="faisca" x="196" y="150" width="6" height="6"/>
    <rect class="faisca" x="22" y="140" width="5" height="5"/>
    <rect class="faisca" x="186" y="120" width="5" height="5"/>
  </g>
</svg>
